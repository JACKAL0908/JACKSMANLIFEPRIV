<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estación Meteorológica - ESP32</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
        h1 { color: #333; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; background: white; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #007BFF; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <h1>Estación Meteorológica ESP32-S3</h1>
    <p>Registros en tiempo real desde Firebase</p>

    <table>
        <thead>
            <tr>
                <th>Temperatura (°C)</th>
                <th>Humedad (%)</th>
                <th>Presión (hPa)</th>
                <th>Luminosidad (lux)</th>
            </tr>
        </thead>
        <tbody id="tabla-datos">
        </tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://estacionclima-35b69-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const lecturasRef = ref(db, 'lecturas');

        onValue(lecturasRef, (snapshot) => {
            const data = snapshot.val();
            const tabla = document.getElementById('tabla-datos');
            tabla.innerHTML = "";

            if (data) {
                Object.values(data).reverse().forEach(lectura => {
                    let fila = `<tr>
                        <td>${lectura.temperatura !== undefined ? lectura.temperatura : '-'}</td>
                        <td>${lectura.humedad !== undefined ? lectura.humedad : '-'}</td>
                        <td>${lectura.presion !== undefined ? lectura.presion : '-'}</td>
                        <td>${lectura.luminosidad !== undefined ? lectura.luminosidad : '-'}</td>
                    </tr>`;
                    tabla.innerHTML += fila;
                });
            } else {
                tabla.innerHTML = "<tr><td colspan='4'>No hay datos registrados aún.</td></tr>";
            }
        });
    </script>

</body>
</html>
